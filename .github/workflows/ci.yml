name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Real Postgres for the server integration tests (BUG-001/002 class:
      # FK / constraint defects that mocks cannot catch).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dnd
          POSTGRES_PASSWORD: dnd
          POSTGRES_DB: dnd_inv_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U dnd -d dnd_inv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dnd:dnd@localhost:5434/dnd_inv_test
      DATABASE_URL_TEST: postgresql://dnd:dnd@localhost:5434/dnd_inv_test

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      # No pnpm cache: keeps clear of the 500 MB Actions storage quota.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      # Real PHB/DMG seed files are gitignored (private use only). Use the
      # shape examples so the loader imports resolve.
      - name: Stage example seed data
        working-directory: packages/seeds/data
        run: |
          cp examples/phb-2024-mundane.example.json phb-2024-mundane.json
          cp examples/dmg-2024.example.json dmg-2024.json

      - name: Generate Prisma client + apply migrations
        run: |
          pnpm --filter ./apps/server exec prisma generate
          pnpm --filter ./apps/server exec prisma migrate deploy

      # Server integration tests acquire catalog items (FK on ItemDefinition).
      - name: Seed item catalog (example seeds)
        run: pnpm --filter ./apps/server db:seed

      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # SECURITY §8: high/critical findings block release. Separate job so a new
  # advisory doesn't mask real check failures.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level high --prod
